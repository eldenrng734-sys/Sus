name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  n8n-workflows-security:
    name: n8n workflow secret leak check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert no secrets in n8n workflows
        run: |
          python -c '
          import sys, re
          from pathlib import Path

          workflow_dir = Path("n8n/workflows")
          if not workflow_dir.exists():
              print("No n8n/workflows directory found.")
              sys.exit(0)

          patterns = [
              re.compile(r"""(password|secret|token|api[_-]?key)\s*["\x27 :=]+\s*["\x27]([a-zA-Z0-9_\-]{16,})["\x27]""", re.I),
              re.compile(r"""BEGIN (RSA|EC|OPENSSH) PRIVATE KEY"""),
              re.compile(r"""bearer\s+[a-zA-Z0-9_\-\.]{16,}""", re.I),
          ]

          violations = []
          allowed = ("$env.", "N8N_", "SERVICE_", "X-Signature")
          for f in workflow_dir.glob("*.json"):
              content = f.read_text(encoding="utf-8")
              for p in patterns:
                  for m in p.finditer(content):
                      matched = m.group(0)
                      if any(a in matched for a in allowed):
                          continue
                      violations.append(f"{f.name}: {matched}")

          if violations:
              print("SECURITY VIOLATION: Potential secret leak in n8n/workflows/:")
              for v in violations:
                  print("  ", v)
              sys.exit(1)
          print("n8n workflow security check passed: zero hardcoded secrets found.")
          '


  alembic-heads:
    name: Alembic — exactly one head + upgrade head
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm_test
          POSTGRES_PASSWORD: crm_test
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Assert exactly one Alembic head (no DB needed)
        run: pytest tests/unit/test_alembic_history.py::test_migration_history_has_one_head -v

      - name: Run upgrade head on empty database
        env:
          TEST_DATABASE_URL: postgresql+psycopg://crm_test:crm_test@localhost:5432/crm_test
          # Provide minimal settings so pydantic-settings doesn't reject startup
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://crm_test:crm_test@localhost:5432/crm_test
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-only-not-a-real-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx' }}
        run: pytest tests/unit/test_alembic_history.py::test_upgrade_head_on_empty_database -v

  rls-audit:
    name: RLS audit — roles and policies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm_superuser
          POSTGRES_PASSWORD: crm_superuser
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_superuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg://crm_superuser:crm_superuser@localhost:5432/crm_test
          MIGRATION_DATABASE_URL: postgresql+psycopg://crm_superuser:crm_superuser@localhost:5432/crm_test
          APP_ENV: test
          JWT_SECRET_KEY: ci-only-not-a-real-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        run: alembic upgrade head

      - name: RLS coverage and role audit
        env:
          DATABASE_URL: postgresql+psycopg://crm_superuser:crm_superuser@localhost:5432/crm_test
          MIGRATION_DATABASE_URL: postgresql+psycopg://crm_superuser:crm_superuser@localhost:5432/crm_test
          APP_ENV: test
          JWT_SECRET_KEY: ci-only-not-a-real-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        run: pytest tests/test_rls_coverage.py -v