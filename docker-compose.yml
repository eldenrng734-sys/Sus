services:
  api:
    build: .
    ports: ["8000:8000"]
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brain
    ports: ["5432:5432"]   # brain only; in real deployments the DB port is never public
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata: