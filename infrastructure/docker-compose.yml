services:
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
        - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${DATABASE_URL}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:-}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      SERVICE_HMAC_SECRET: ${SERVICE_HMAC_SECRET:-}
      N8N_SERVICE_SECRET: ${SERVICE_HMAC_SECRET:-}
      WATCHFILES_FORCE_POLLING: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: no-reply@crm.local
      FRONTEND_BASE_URL: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ../backend
    command: python -m app.worker
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${DATABASE_URL}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20.0}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      AI_REVIEW_CONFIDENCE_THRESHOLD: ${AI_REVIEW_CONFIDENCE_THRESHOLD:-0.6}
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
